services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indooptik-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-indo_optik}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEEDERS: ${RUN_SEEDERS:-true}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_public_storage:/var/www/html/storage/app/public
    networks:
      - indooptik

  db:
    image: mysql:8.4
    container_name: indooptik-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-indo_optik}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - indooptik

volumes:
  db_data:
  app_public_storage:

networks:
  indooptik:
    driver: bridge
